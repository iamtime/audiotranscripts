name: Build Windows app

# Manual run: the installer is an artifact of the run.
# Pushing a tag v*: also attached to that release (created as a draft if there is none yet).
on:
  workflow_dispatch:
    inputs:
      gpu:
        description: "Bundle cuBLAS/cuDNN for NVIDIA GPUs (+1.8 GB)"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash          # Git Bash, as build_app_win.sh expects
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build installer
        env:
          GPU: ${{ inputs.gpu && '1' || '0' }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: packaging/build_app_win.sh
      - uses: actions/upload-artifact@v4
        with:
          name: voice-rec-windows${{ inputs.gpu && '-gpu' || '' }}
          path: app/dist/*.exe
          retention-days: 14
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --draft --verify-tag --title "Voice Rec ${TAG#v}" --notes ""
          gh release upload "$TAG" app/dist/*.exe --clobber
