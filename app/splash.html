<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>ushi</title>
<style>
  html, body { margin: 0; height: 100%; background: #fcfaf7; color: #24252f;
    font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif; -webkit-app-region: drag; user-select: none; }
  .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  img { width: 300px; height: auto; display: block; }
  .row { display: flex; align-items: center; gap: 9px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #c9612b; box-shadow: 0 0 0 0 rgba(201, 97, 43, .55);
    animation: pulse 1.4s infinite; flex: none; }
  #status { color: #5b5852; max-width: 320px; text-align: center; min-height: 1.4em; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(201, 97, 43, .5); } 70% { box-shadow: 0 0 0 10px rgba(201, 97, 43, 0); }
    100% { box-shadow: 0 0 0 0 rgba(201, 97, 43, 0); } }
</style>
</head>
<body>
<div class="wrap">
  <img src="splash-logo.jpg" alt="ushi">
  <div class="row"><span class="dot"></span><span id="status">Starting…</span></div>
</div>
<script>
  window.setStatus = (t) => { document.getElementById('status').textContent = t; };
</script>
</body>
</html>
